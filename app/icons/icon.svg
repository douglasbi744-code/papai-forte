<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22344A"/>
      <stop offset=".62" stop-color="#132030"/>
      <stop offset="1" stop-color="#0B1118"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset=".55" stop-color="#F0A04B"/>
      <stop offset="1" stop-color="#E3892A"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".59" r=".5">
      <stop offset="0" stop-color="#F0A04B" stop-opacity=".45"/>
      <stop offset="1" stop-color="#F0A04B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="above"><rect x="0" y="0" width="512" height="300"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="256" cy="300" r="230" fill="url(#glow)"/>
  <g clip-path="url(#above)">
    <circle cx="256" cy="300" r="118" fill="url(#sun)"/>
  </g>
  <!-- raios -->
  <g stroke="#F0A04B" stroke-width="14" stroke-linecap="round" opacity=".9">
    <line x1="256" y1="132" x2="256" y2="108"/>
    <line x1="152" y1="176" x2="136" y2="160"/>
    <line x1="360" y1="176" x2="376" y2="160"/>
  </g>
  <!-- reflexo -->
  <g stroke-linecap="round">
    <line x1="196" y1="340" x2="316" y2="340" stroke="#F0A04B" stroke-width="12" opacity=".75"/>
    <line x1="220" y1="370" x2="292" y2="370" stroke="#F0A04B" stroke-width="12" opacity=".5"/>
    <line x1="240" y1="400" x2="272" y2="400" stroke="#F0A04B" stroke-width="12" opacity=".28"/>
  </g>
  <!-- barra -->
  <rect x="66" y="292" width="380" height="16" rx="8" fill="#E5ECF2"/>
  <rect x="96" y="238" width="32" height="124" rx="10" fill="#E5ECF2"/>
  <rect x="132" y="258" width="22" height="84" rx="8" fill="#E5ECF2"/>
  <rect x="384" y="238" width="32" height="124" rx="10" fill="#E5ECF2"/>
  <rect x="358" y="258" width="22" height="84" rx="8" fill="#E5ECF2"/>
</svg>
